name: Restart Azure App Service - diusweroutine

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3329C2E382C8486C9FF92D016D24B31B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0E49479C89A4435A9DEE39F571751C2D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00233EE38F304450840B395C7EBF7A71 }}

      - name: Restart Web App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Resolving resource group for diusweroutine..."
            RG=$(az webapp list --query "[?name=='diusweroutine'].resourceGroup" -o tsv | head -n 1)
            echo "Target Resource Group: $RG"
            if [ -n "$RG" ]; then
              az webapp restart --name diusweroutine --resource-group "$RG"
            else
              az webapp restart --name diusweroutine
            fi
            echo "Microsoft Azure App Service diusweroutine successfully restarted."
